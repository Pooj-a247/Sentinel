spring.application.name=sentinel
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sentinel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
sentinel.storage-dir=${SENTINEL_STORAGE_DIR:./storage/evidence}
sentinel.monitor.enabled=${SENTINEL_MONITOR_ENABLED:true}
sentinel.monitor.interval-ms=${SENTINEL_MONITOR_INTERVAL_MS:300000}
